<style>
:root{--ink:#26342f;--muted:#647169;--paper:#f5f2e9;--green:#42594a;--line:#d9ded5}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:fixed;top:18px;left:20px;z-index:3;max-width:min(580px,calc(100vw - 40px));padding:14px 18px;border:1px solid #d6d9cf;border-radius:17px;background:#f8f6eee8;backdrop-filter:blur(12px);box-shadow:0 8px 28px #31453812}.tag{font-size:10px;font-weight:700;letter-spacing:.15em;color:#66786c;text-transform:uppercase}.top h1{margin:3px 0 2px;font-size:clamp(18px,3vw,25px);letter-spacing:-.03em}.top p{margin:0;color:var(--muted);font-size:12px}.panel{position:fixed;right:18px;top:18px;z-index:3;width:min(225px,42vw);padding:12px;border:1px solid #d6d9cf;border-radius:17px;background:#f8f6eee8;backdrop-filter:blur(12px);box-shadow:0 8px 28px #31453812}.panel h2{margin:0 0 8px;font-size:12px;color:#647169}.actors{display:grid;grid-template-columns:1fr;gap:6px}.actor,.smallbtn{border:1px solid #d9ddd4;border-radius:11px;background:#fffdf7;color:#314238;padding:8px 10px;text-align:left;font:inherit;font-size:12px;cursor:pointer;transition:.15s}.actor.active{background:#435b4b;color:white;border-color:#435b4b}.actor b{display:block;font-size:12px}.actor span{font-size:10px;opacity:.75}.actions{display:flex;gap:6px;margin-top:8px}.smallbtn{flex:1;text-align:center;padding:7px 4px;font-size:11px}.tips{margin-top:8px;padding-top:8px;border-top:1px solid #e2e3dc;color:#637168;font-size:10px;line-height:1.55}.bottom{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:3;padding:8px 13px;border-radius:99px;background:#f8f6eee8;border:1px solid #d6d9cf;color:#58655d;font-size:11px;white-space:nowrap;backdrop-filter:blur(10px)}#status{position:fixed;left:20px;bottom:16px;z-index:3;color:#6a776f;font-s <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<body>
<div id="scene"></div>
<header class="top"><div class="tag">Oakcrossing · Neighbourhood walk</div><h1>684 Oakcrossing Road</h1></header>
<aside class="panel"><h2>选择漫游角色</h2><div class="actors"><button class="actor active" data-actor="hoodie"><b>A</b><span>灰色连帽衫</span></button><button class="actor" data-actor="black"><b>B</b><span>黑色上衣</span></button><button class="actor" data-actor="kim"><b>Kim</b><span>狸花猫</span></button></div><div class="actions"><button class="smallbtn" id="wander">暂停漫游</button><button class="smallbtn" id="home">回到房子</button></div><div class="tips">拖动旋转视角 · 滚轮缩放<br>WASD / 方向键移动当前角色<br>女孩会分开行动，Kim 自己在附近巡游</div></aside>
<div class="bottom">拖动查看 · 滚轮缩放 · WASD 移动选中角色</div><div id="status">加载街区模型…</div><div class="joystick" id="joystick"><div class="joyknob" id="joyknob"></div></div>


<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const scene=new THREE.Scene();scene.background=new THREE.Color('#e8e5d8');scene.fog=new THREE.Fog('#e8e5d8',2200,4200);
// The neighborhood spans nearly a kilometre. A very small near plane paired with
// a 5 km far plane wastes depth-buffer precision and makes distant ground layers flicker.
const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.5,2600);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.querySelector('#scene').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.06;controls.maxPolarAngle=Math.PI*.47;controls.minDistance=8;controls.maxDistance=1800;
scene.add(new THREE.HemisphereLight('#fff7e6','#73836e',2.0));const sun=new THREE.DirectionalLight('#fff1d1',2.4);sun.position.set(-70,100,36);sun.castShadow=false;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-110;sun.shadow.camera.right=110;sun.shadow.camera.top=110;sun.shadow.camera.bottom=-110;scene.add(sun);
const mat=(color,roughness=1,extra={})=>new THREE.MeshStandardMaterial({color,roughness,...extra});
// All neighborhood geometry comes from the supplied SketchUp model. Its shared scale is inches to metres.
const MAP_SCALE=.0254;
async function fetchAssetJson(name){if(name!=='town-layout.json')throw new Error('未知数据文件：'+name);const response=await fetch(new URL(name,document.baseURI));if(!response.ok)throw new Error('街区数据读取失败：HTTP '+response.status);return response.json()}
async function parseAssetGlb(name){if(name!=='house-skp.glb')throw new Error('未知模型文件：'+name);const response=await fetch(new URL(name,document.baseURI));if(!response.ok)throw new Error('主屋模型读取失败：HTTP '+response.status);const bytes=await response.arrayBuffer();if(bytes.byteLength!==885408)throw new Error('主屋模型文件不完整：'+bytes.byteLength+'/885408 bytes');const header=new DataView(bytes);if(header.getUint32(0,true)!==0x46546c67||header.getUint32(8,true)!==bytes.byteLength)throw new Error('主屋模型 GLB 文件头或总长度无效');return await new Promise((resolve,reject)=>new GLTFLoader().parse(bytes,document.baseURI,resolve,reject))}
const town=new THREE.Group();scene.add(town);
let layoutData;
const worldPoint=p=>new THREE.Vector3((p[0]-layoutData.map.centerX)*MAP_SCALE,0,(layoutData.map.centerY-p[1])*MAP_SCALE);
function polygonMesh(poly,y,color,opacity=1){if(poly.length<3)return;const shape=new THREE.Shape();poly.forEach((p,i)=>{const x=(p[0]-layoutData.map.centerX)*MAP_SCALE,sy=(p[1]-layoutData.map.centerY)*MAP_SCALE;i?shape.lineTo(x,sy):shape.moveTo(x,sy)});shape.closePath();const mesh=new THREE.Mesh(new THREE.ShapeGeometry(shape),new THREE.MeshBasicMaterial({color,transparent:opacity<1,opacity,side:THREE.DoubleSide,toneMapped:false}));mesh.rotation.x=-Math.PI/2;mesh.position.y=y;mesh.receiveShadow=true;town.add(mesh)}
function isStreetSurface(poly){let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;for(const [x,y] of poly){minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}const width=(maxX-minX)*MAP_SCALE,depth=(maxY-minY)*MAP_SCALE;let twiceArea=0;for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];twiceArea+=a[0]*b[1]-b[0]*a[1]}const area=Math.abs(twiceArea)*.5*MAP_SCALE*MAP_SCALE;return Math.min(width,depth)<=36||area<=1800}
function pathLines(path,material,closed=false){const pts=path.map(worldPoint);if(pts.length<2)return;const geom=new THREE.BufferGeometry().setFromPoints(closed?[...pts,pts[0]]:pts);town.add(new THREE.Line(geom,material))}
const roadMat=mat('#d8d5ce'),parkMat=mat('#8da184'),waterMat=mat('#8ebfc1');
const wireMat=new THREE.LineBasicMaterial({color:'#fffdf5',transparent:true,opacity:.94});
function frameBuilding(poly,index){if(poly.length<3)return;const pts=poly.map(worldPoint);let cx=0,cz=0;for(const p of pts){cx+=p.x;cz+=p.z}cx/=pts.length;cz/=pts.length;
 let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;for(const p of pts){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minZ=Math.min(minZ,p.z);maxZ=Math.max(maxZ,p.z)}
 const w=maxX-minX,d=maxZ-minZ;if(w<2||d<2||w>75||d>75)return;
 const height=Math.min(5.5,Math.max(3.2,Math.min(w,d)*.42)),roof=height+Math.min(2.6,Math.max(1.4,Math.min(w,d)*.23));
 const verts=[];function seg(a,b){verts.push(a.x,a.y,a.z,b.x,b.y,b.z)}
 for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length],ab={x:a.x,y:0,z:a.z},bb={x:b.x,y:0,z:b.z},at={x:a.x,y:height,z:a.z},bt={x:b.x,y:height,z:b.z};seg(ab,bb);seg(at,bt);seg(ab,at)}
 // A compact white hip-roof frame follows the footprint rather than imposing a rotated box.
 const ridgeA={x:minX+w*.2,y:roof,z:cz},ridgeB={x:maxX-w*.2,y:roof,z:cz};seg(ridgeA,ridgeB);
 for(const p of pts){const target=Math.abs(p.x-ridgeA.x)<Math.abs(p.x-ridgeB.x)?ridgeA:ridgeB;seg({x:p.x,y:height,z:p.z},target)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));town.add(new THREE.LineSegments(g,wireMat));
}
const loadState={layout:false,house:false,error:''};function reportLoadState(){const el=document.querySelector('#status');el.textContent=loadState.error||(!loadState.layout?'正在载入街区…':!loadState.house?'街区已载入 · 正在载入庭院主屋…':'SKP街区与庭院版主屋均已载入')}const layoutPromise=fetchAssetJson('town-layout.json');layoutPromise.then(data=>{layoutData=data;const m=data.map;const width=(m.maxX-m.minX)*MAP_SCALE,depth=(m.maxY-m.minY)*MAP_SCALE;const ground=new THREE.Mesh(new THREE.PlaneGeometry(width+12,depth+12),new THREE.MeshBasicMaterial({color:'#9aa487',toneMapped:false}));ground.rotation.x=-Math.PI/2;ground.position.set(0,-2,0);town.add(ground);
 const homeX=(m.homeX-m.centerX)*MAP_SCALE,homeZ=(m.centerY-m.homeY)*MAP_SCALE;window.MAP_HOME={x:homeX,z:homeZ};window.MAP_CENTER={x:m.centerX,z:m.centerY};
 // Keep mapped surfaces clearly above the single background plane so their depth values do not compete.
 for(const p of data.parks)polygonMesh(p,-.3,'#9aa487');const waterSeen=new Set();for(const p of data.water){const key=p.map(([x,y])=>`${Math.round(x)},${Math.round(y)}`).sort().join(';');if(!waterSeen.has(key)){waterSeen.add(key);polygonMesh(p,-.15,'#8ebfc1')}}for(const p of data.roads)if(isStreetSurface(p))polygonMesh(p,-.05,'#c3c1b7');
 for(const line of data.railways)pathLines(line,new THREE.LineBasicMaterial({color:'#74766f',linewidth:2}));
 data.buildings.forEach((p,i)=>frameBuilding(p,i));
 loadState.layout=true;reportLoadState();
 focusHouse(48);
}).catch(e=>{console.error('SketchUp neighborhood geometry failed to load',e);loadState.error='街区模型载入失败：'+(e.message||e);reportLoadState()});
parseAssetGlb('house-skp.glb').then(g=>layoutPromise.then(data=>{const home=g.scene;const staticFigureParts=new Set(['Skin','Eye','Blush','Warm brown tabby','Tabby stripes','Cat cream muzzle','Cat nose','Black hair','Hoodie gray','Denim blue','Black outfit','Sock white','Phone case','Green cat eyes','Cat inner ear']);home.traverse(o=>{if(staticFigureParts.has(o.name))o.visible=false});home.rotation.y=0.36;const m=layoutData.map;const hx=(m.homeX-m.centerX)*MAP_SCALE,hz=(m.centerY-m.homeY)*MAP_SCALE;home.position.set(hx+.0775,0,hz-.35);town.add(home);loadState.house=true;reportLoadState();focusHouse(42);})).catch(e=>{console.error('Courtyard house model could not load',e);loadState.error='主屋模型载入失败：'+(e.message||e);reportLoadState()});

const skin=mat('#efc7a6'),hair=mat('#161719'),black=mat('#202126'),hoodie=mat('#a7a9a7'),denim=mat('#46617b'),sock=mat('#f0eee8'),eye=mat('#25221f'),white=mat('#fff8e8'),catCoat=mat('#62564a'),stripe=mat('#342e2a'),cream=mat('#d9d0bf'),greenEye=mat('#77917a'),pink=mat('#9b665d');
function orb(parent,m,x,y,z,sx,sy,sz){const o=new THREE.Mesh(new THREE.SphereGeometry(1,14,10),m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;parent.add(o);return o}
function limb(parent,a,b,r1,r2,m){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A);const o=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,d.length(),10),m);o.position.copy(A.add(B).multiplyScalar(.5));o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());o.castShadow=true;parent.add(o);return o}
function girl(type){const root=new THREE.Group(),body=new THREE.Group();root.add(body);const isHoodie=type==='hoodie';const shirt=isHoodie?hoodie:black,pants=isHoodie?denim:black;orb(body,shirt,0,1.03,0,.34,.43,.22);orb(body,skin,0,1.65,0,.23,.27,.22);orb(body,hair,0,1.83,-.02,.26,.24,.24);orb(body,hair,0,1.43,-.15,.235,.48,.12);for(let x of [-.19,.19]){const lock=orb(body,hair,x,1.48,.005,.08,.37,.09);lock.rotation.z=x*.55}orb(body,skin,-.235,1.64,0,.045,.07,.06);orb(body,skin,.235,1.64,0,.045,.07,.06);for(let x of [-.085,.085]){orb(body,white,x,1.67,.202,.043,.04,.025);orb(body,eye,x,1.67,.224,.021,.028,.014)}orb(body,skin,0,1.58,.217,.025,.025,.02);
if(isHoodie){const hood=new THREE.Mesh(new THREE.TorusGeometry(.24,.055,8,20,Math.PI),hoodie);hood.position.set(0,1.38,-.11);hood.rotation.x=Math.PI/2;body.add(hood);orb(body,white,-.09,1.04,.21,.015,.11,.012);orb(body,white,.09,1.04,.21,.015,.11,.012)}else{orb(body,skin,0,1.37,.23,.11,.08,.025);}
const legs=[];for(let x of [-.13,.13]){const pivot=new THREE.Group();pivot.position.set(x,.72,0);body.add(pivot);limb(pivot,[0,0,0],[0,-.54,0],.105,.08,pants);if(isHoodie){limb(pivot,[0,-.52,0],[0,-.68,.03],.07,.065,sock);orb(pivot,black,0,-.7,.10,.14,.055,.22)}else{limb(pivot,[0,0,0],[0,-.25,0],.105,.085,black);limb(pivot,[0,-.25,0],[0,-.68,0],.08,.065,skin);limb(pivot,[0,-.62,0],[0,-.7,.01],.075,.075,sock);orb(pivot,white,0,-.71,.10,.14,.045,.20)}legs.push(pivot)}
const arms=[];for(let x of [-1,1]){const pivot=new THREE.Group();pivot.position.set(x*.31,1.33,0);body.add(pivot);limb(pivot,[0,0,0],[x*.06,-.38,.02],.09,.07,shirt);limb(pivot,[x*.06,-.38,.02],[x*.04,-.65,.10],.07,.055,skin);orb(pivot,skin,x*.04,-.68,.12,.075,.07,.075);arms.push(pivot)}
return {root,body,legs,arms,type,phase:Math.random()*6};}
function tabby(){const root=new THREE.Group(),body=new THREE.Group();root.add(body);orb(body,catCoat,0,.38,0,.28,.35,.2);orb(body,catCoat,0,.68,.08,.22,.22,.19);for(let s of [-1,1]){const ear=new THREE.Mesh(new THREE.ConeGeometry(.1,.25,4),catCoat);ear.position.set(s*.14,.91,.08);ear.rotation.z=s*-.18;body.add(ear);orb(body,cream,s*.14,.70,.245,.055,.05,.02);orb(body,greenEye,s*.08,.70,.251,.033,.03,.018);orb(body,eye,s*.08,.70,.27,.009,.025,.009);orb(body,cream,s*.04,.61,.26,.065,.04,.025);orb(body,catCoat,s*.17,.13,.05,.10,.13,.12);limb(body,[s*.11,.35,.07],[s*.11,.08,.11],.055,.05,catCoat)}orb(body,pink,0,.60,.287,.025,.02,.015);for(let k=0;k<3;k++){const t=new THREE.Mesh(new THREE.TorusGeometry(.17+k*.035,.018,5,14,Math.PI*.72),stripe);t.position.set(0,.45-k*.065,-.18);t.rotation.x=Math.PI/2;body.add(t)}for(let x of [-.12,-.06,0,.06,.12])orb(body,stripe,x,.84,.235,.018,.08,.015);const tail=limb(body,[.22,.12,-.08],[.43,.1,-.18],.055,.05,catCoat);limb(body,[.43,.1,-.18],[.34,.14,-.27],.05,.035,stripe);return {root,body,type:'kim',phase:Math.random()*6};}
const MAP_HOME={x:(15006.277914675553-17818.466203024895)*.0254,z:(16948.07420389975-20752.663103795156)*.0254};const actors={hoodie:girl('hoodie'),black:girl('black'),kim:tabby()};
actors.hoodie.root.position.set(MAP_HOME.x-4,-.25,MAP_HOME.z+5);actors.black.root.position.set(MAP_HOME.x+5,-.25,MAP_HOME.z-4);actors.kim.root.position.set(MAP_HOME.x+4,-.25,MAP_HOME.z+7);actors.kim.root.scale.setScalar(.38);for(const a of Object.values(actors))scene.add(a.root);
// Their independent circuits stay in the streets around 684 Oakcrossing Road.
const routes={hoodie:[[-4,5],[-8,9],[-12,15],[-15,25],[-17,40],[-20,54],[-17,67],[-10,72],[0,73],[12,70],[22,62],[25,48]],black:[[5,-4],[9,-12],[13,-23],[22,-31],[34,-37],[42,-35],[47,-25],[43,-12],[39,1],[39,13],[44,27],[54,34]],kim:[[4,7],[1,11],[-5,13],[-9,8],[-6,2],[0,-2],[8,-4],[12,2],[8,7],[2,10]]};
for(const [key,a] of Object.entries(actors)){a.route=routes[key].map(p=>new THREE.Vector3(MAP_HOME.x+p[0]-9,-.25,MAP_HOME.z+p[1]-14));a.targetIndex=1;a.speed=key==='kim'?2.0:3.1;a.auto=true;}
let selected='hoodie';const keys=new Set();let stick={x:0,y:0};
document.querySelectorAll('.actor').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.actor;document.querySelectorAll('.actor').forEach(x=>x.classList.toggle('active',x===b));}));
document.querySelector('#wander').onclick=e=>{const a=actors[selected];a.auto=!a.auto;e.currentTarget.textContent=a.auto?'暂停漫游':'开始漫游'};
function focusHouse(distance=42){const target=new THREE.Vector3(MAP_HOME.x,2,MAP_HOME.z);const direction=new THREE.Vector3(.58,.78,.24).normalize();controls.target.copy(target);camera.position.copy(target).addScaledVector(direction,distance);controls.update()}document.querySelector('#home').onclick=()=>focusHouse(34);
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase())});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
const joy=document.querySelector('#joystick'),knob=document.querySelector('#joyknob');let activePointer=null;joy.addEventListener('pointerdown',e=>{activePointer=e.pointerId;joy.setPointerCapture(e.pointerId);moveJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===activePointer)moveJoy(e)});function moveJoy(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.min(35,Math.hypot(dx,dy)),ang=Math.atan2(dy,dx);stick.x=Math.cos(ang)*d/35;stick.y=Math.sin(ang)*d/35;knob.style.transform=`translate(calc(-50% + ${stick.x*35}px),calc(-50% + ${stick.y*35}px))`}function endJoy(){activePointer=null;stick={x:0,y:0};knob.style.transform='translate(-50%,-50%)'}joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);for(const [key,a] of Object.entries(actors)){const p=a.root.position;let dx=0,dz=0;const manual=key===selected; if(manual){dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0)+stick.x;dz=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0)+stick.y;}if(Math.hypot(dx,dz)>.12){a.auto=false;const len=Math.hypot(dx,dz);dx/=len;dz/=len;p.x+=dx*a.speed*dt;p.z+=dz*a.speed*dt;a.root.rotation.y=Math.atan2(dx,dz)}else if(a.auto){const target=a.route[a.targetIndex],vx=target.x-p.x,vz=target.z-p.z,dist=Math.hypot(vx,vz);if(dist<1){a.targetIndex=(a.targetIndex+1)%a.route.length}else{dx=vx/dist;dz=vz/dist;p.x+=dx*a.speed*dt;p.z+=dz*a.speed*dt;a.root.rotation.y=Math.atan2(dx,dz)}}p.x=THREE.MathUtils.clamp(p.x,-455,455);p.z=THREE.MathUtils.clamp(p.z,-440,440);a.phase+=dt*(a.type==='kim'?5:7);if(a.legs){a.legs.forEach((l,i)=>l.rotation.x=Math.sin(a.phase+i*Math.PI)*.45);a.arms.forEach((l,i)=>l.rotation.x=Math.sin(a.phase+i*Math.PI+Math.PI)*.22);a.body.position.y=Math.abs(Math.sin(a.phase*2))*.035}else{a.body.position.y=Math.sin(a.phase)*.025}}
controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
